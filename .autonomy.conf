# Per-repo configuration for scripts/local_ops/autonomous_ops.sh, which lives in
# the alpaca-options-bot repo and drives autonomy for both projects.
#
# This repo is PUBLIC and keeps config.env and oauth-client.json in its root.
# Both are gitignored and untracked, and the engine stages only files a run
# actually created — never `git add -A`. Do not weaken either of those.

VENV="venv"                                   # not .venv, unlike the trading bot
TEST_CMD="venv/bin/python -m pytest tests/ -q --color=no"

# Paths whose edits are held on a branch rather than pushed straight to main
# when the daily batch could be mid-run. The 06:00 job renders and uploads
# video, so rewriting the pipeline underneath it is the same hazard as editing
# risk logic during market hours.
DEFER_PATHS='^(src/(rhyme_manager|video_generator|cartoon|drive_sync|upload_queue)\.py|run_daily\.py)'
DEFER_REASON="the daily video pipeline"
